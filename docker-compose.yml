# Full stack: docker compose up --build
#   frontend  http://localhost:3000
#   backend   http://localhost:8080
# Database only (for local development): docker compose up -d postgres
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: perfume
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d perfume"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: jdbc:postgresql://postgres:5432/perfume
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD:-root}
      FRONTEND_HOST: ${FRONTEND_HOST:-localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      RECAPTCHA_SECRET: ${RECAPTCHA_SECRET:-}
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: ${BACKEND_PUBLIC_URL:-http://localhost:8080}
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  uploads:

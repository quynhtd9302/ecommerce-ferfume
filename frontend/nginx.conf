server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Single page app: let React Router handle unknown paths
    location / {
        try_files $uri /index.html;
    }

    # index.html references hashed /static/ filenames, so it must never be cached —
    # otherwise browsers keep serving a stale page after a new deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

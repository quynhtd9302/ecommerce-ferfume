# ===== Database =====
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/perfume}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.generate-ddl=false
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ===== File upload =====
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB
# Local folder where uploaded perfume images are stored (served at /img/**)
upload.path=${UPLOAD_PATH:uploads}

# ===== Mail =====
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.port=${MAIL_PORT:465}
spring.mail.protocol=smtps
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
mail.debug=false

# ===== reCAPTCHA (leave RECAPTCHA_SECRET empty to skip verification in development) =====
recaptcha.secret=${RECAPTCHA_SECRET:}
recaptcha.url=https://www.google.com/recaptcha/api/siteverify?secret=%s&response=%s

# ===== OAuth2 (set real client ids/secrets via environment variables) =====
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.google.scope=email,profile

spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.provider.facebook.authorization-uri=https://www.facebook.com/v10.0/dialog/oauth
spring.security.oauth2.client.provider.facebook.user-info-uri=https://graph.facebook.com/v10.0/me?fields=email,first_name,last_name,name

spring.security.oauth2.client.registration.github.client-id=${GITHUB_CLIENT_ID:changeme}
spring.security.oauth2.client.registration.github.client-secret=${GITHUB_CLIENT_SECRET:changeme}
spring.security.oauth2.client.registration.github.scope=user:email,read:user

# Frontend host (CORS + links in emails / OAuth2 redirect).
# Not named "hostname": the HOSTNAME environment variable (set by Docker) would override it.
app.frontend-host=${FRONTEND_HOST:localhost:3000}

# ===== JWT =====
jwt.header=Authorization
jwt.secret=${JWT_SECRET:change-this-secret-in-production}
# token lifetime in seconds (7 days)
jwt.expiration=604800

logging.level.com.gmail.tdquynh09.ecommerce.controller=debug
